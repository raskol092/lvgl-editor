<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
<script>
  var query = new URLSearchParams(window.location.search);
  var Module = {
    arguments: [query.get('w') || '480', query.get('h') || '320'],
    canvas: document.getElementById('canvas'),
    onRuntimeInitialized: function() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'lvgl-ready' }, window.location.origin);
      }
    }
  };
  window.addEventListener('message', function(e) {
    if (e.source !== window.parent || e.origin !== window.location.origin) return;
    if (e.data.type === 'load-ui') {
      var json = e.data.json;
      var len = Module.lengthBytesUTF8(json) + 1;
      var ptr = Module._malloc(len);
      Module.stringToUTF8(json, ptr, len);
      Module._load_ui_json(ptr);
      Module._free(ptr);
    }
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
